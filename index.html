<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1410">
<title>Michi's Rides — Show Tracker</title>
<style>
  :root{
    --ink:#1a1410;
    --paper:#f5efe4;
    --dust:#e8dfce;
    --line:#c9bca3;
    --brand:#7a4a28;       /* saddle leather */
    --brand-deep:#5c3419;
    --herd:#3f6d54;        /* sage green — the "her ride" highlight */
    --herd-soft:#e2ede6;
    --amber:#c78b32;
    --done:#a89a82;
    --live:#b8402c;
    font-size:17px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--ink);}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    color:var(--ink);
    max-width:560px;margin:0 auto;
    background:var(--paper);
    min-height:100dvh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .util{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}

  /* ---- header ---- */
  header{
    position:sticky;top:0;z-index:20;
    background:var(--ink);color:var(--paper);
    padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;
    border-bottom:3px solid var(--brand);
  }
  .eyebrow{font-family:ui-monospace,monospace;font-size:.62rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--amber);margin-bottom:4px;}
  header h1{font-size:1.5rem;font-weight:600;letter-spacing:-.01em;line-height:1;}
  header h1 small{font-size:.8rem;color:var(--line);font-weight:400;letter-spacing:0;}

  /* ---- day switcher ---- */
  .days{display:flex;gap:6px;margin-top:12px;}
  .days button{
    font-family:ui-monospace,monospace;font-size:.66rem;letter-spacing:.08em;
    text-transform:uppercase;font-weight:700;cursor:pointer;
    padding:7px 13px;border-radius:9px;border:1.5px solid rgba(245,239,228,.28);
    background:transparent;color:var(--line);
  }
  .days button.on{background:var(--brand);color:#fff;border-color:var(--brand);}

  /* ---- next-ride card ---- */
  .next{
    margin:16px 14px 6px;
    background:var(--herd);color:#fff;
    border-radius:16px;padding:18px 18px 16px;
    box-shadow:0 6px 22px rgba(63,109,84,.32);
    position:relative;overflow:hidden;
  }
  .next.none{background:#4a4136;box-shadow:none;}
  .next .tag{font-family:ui-monospace,monospace;font-size:.6rem;letter-spacing:.24em;
    text-transform:uppercase;opacity:.82;}
  .next .cls{font-size:1.15rem;font-weight:600;margin-top:3px;line-height:1.15;}
  .next .horse{font-size:1rem;margin-top:8px;opacity:.95;}
  .next .horse b{font-weight:600;}
  .next .eta{
    margin-top:14px;display:flex;align-items:baseline;gap:10px;
    border-top:1px solid rgba(255,255,255,.25);padding-top:12px;
  }
  .next .eta .big{font-family:ui-monospace,monospace;font-size:2.3rem;font-weight:600;
    line-height:.9;letter-spacing:-.02em;}
  .next .eta .sub{font-size:.82rem;opacity:.9;line-height:1.25;}
  .next .queue{margin-top:10px;font-size:.8rem;opacity:.9;}

  /* ---- schedule (rest of day) ---- */
  .sched{
    margin:10px 14px 2px;border:1px solid var(--line);border-radius:14px;
    background:var(--paper);overflow:hidden;
  }
  .sched-head{
    display:flex;align-items:center;gap:10px;padding:12px 14px;
    cursor:pointer;user-select:none;
  }
  .sched-head .lbl{
    font-family:ui-monospace,monospace;font-size:.6rem;letter-spacing:.16em;
    text-transform:uppercase;color:#7a6d56;font-weight:700;flex-shrink:0;
  }
  .sched-head .sum{flex:1;font-size:.78rem;color:#6b5d47;line-height:1.3;}
  .sched-head .chev{flex-shrink:0;color:var(--line);font-size:.8rem;transition:transform .2s;}
  .sched.open .sched-head .chev{transform:rotate(90deg);}
  .sched-body{display:none;padding:0 12px 10px;}
  .sched.open .sched-body{display:block;}

  .srow{
    display:flex;align-items:center;gap:11px;padding:9px 4px;
    border-top:1px solid var(--dust);
  }
  .srow:first-child{border-top:none;}
  .srow.her{background:var(--herd-soft);border-radius:9px;padding:9px 8px;border-top-color:transparent;}
  .srow .scid{
    font-family:ui-monospace,monospace;font-weight:700;font-size:.72rem;
    background:var(--ink);color:var(--paper);border-radius:6px;
    padding:4px 6px;min-width:40px;text-align:center;flex-shrink:0;
  }
  .srow.her .scid{background:var(--herd);}
  .srow.live .scid{background:var(--live);}
  .srow .smid{flex:1;min-width:0;}
  .srow .sname{font-size:.9rem;font-weight:600;line-height:1.18;}
  .srow.her .sname{color:var(--herd);}
  .sbadge{
    display:inline-block;background:var(--herd);color:#fff;border-radius:5px;
    padding:1px 6px;font-family:ui-monospace,monospace;font-size:.58rem;font-weight:700;
    letter-spacing:.03em;margin-left:6px;vertical-align:middle;
  }
  .srow .smeta{font-family:ui-monospace,monospace;font-size:.64rem;color:#7a6d56;margin-top:3px;}
  .srow .stime{text-align:right;flex-shrink:0;}
  .srow .stime .clk{font-family:ui-monospace,monospace;font-size:.86rem;font-weight:700;color:var(--brand-deep);}
  .srow.live .stime .clk{color:var(--live);}
  .srow .stime .eta{font-family:ui-monospace,monospace;font-size:.62rem;color:#9a8c72;margin-top:2px;}
  .sgap{
    padding:2px 6px 2px 51px;font-family:ui-monospace,monospace;
    font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:#a2937a;
  }

  /* ---- controls ---- */
  .controls{display:flex;gap:8px;margin:12px 14px 4px;}
  .controls button{
    flex:1;font-family:ui-monospace,monospace;font-size:.72rem;letter-spacing:.06em;
    text-transform:uppercase;padding:11px 6px;border:1.5px solid var(--line);
    background:var(--paper);color:var(--ink);border-radius:11px;font-weight:600;
    cursor:pointer;transition:transform .08s;
  }
  .controls button:active{transform:scale(.96);}
  .controls button.hot{background:var(--brand);color:#fff;border-color:var(--brand);}

  .pacenote{margin:6px 16px 2px;font-size:.74rem;color:#6b5d47;line-height:1.4;}
  .pacenote b{color:var(--brand-deep);}
  .daystart{margin:2px 16px 2px;font-family:ui-monospace,monospace;font-size:.66rem;
    letter-spacing:.04em;color:#8a7c63;cursor:pointer;}
  .daystart b{color:var(--brand-deep);text-decoration:underline;text-decoration-style:dotted;
    text-underline-offset:2px;}

  /* ---- calibration chip ---- */
  .calib{
    margin:8px 14px 2px;display:flex;align-items:center;gap:10px;
    background:var(--herd-soft);border:1px solid #cfe0d5;border-radius:11px;padding:9px 11px;
  }
  .calib .msg{flex:1;font-size:.76rem;color:#33513f;line-height:1.35;}
  .calib .msg b{color:var(--herd);}
  .calib button{
    flex-shrink:0;font-family:ui-monospace,monospace;font-size:.62rem;letter-spacing:.06em;
    text-transform:uppercase;font-weight:700;cursor:pointer;
    background:var(--herd);color:#fff;border:none;border-radius:9px;padding:8px 11px;
  }
  .calib button:active{transform:scale(.96);}
  .calib.match{background:var(--dust);border-color:var(--line);}
  .calib.match .msg{color:#6b5d47;}
  .calib.match .msg b{color:var(--brand-deep);}

  /* ---- list ---- */
  .list{padding:8px 10px 40px;}
  .class{
    background:var(--paper);border:1px solid var(--line);
    border-radius:14px;margin:9px 4px;overflow:hidden;
    transition:opacity .3s;
  }
  .class.done{opacity:.5;}
  .class.live{border-color:var(--live);border-width:2px;box-shadow:0 3px 14px rgba(184,64,44,.18);}
  .class.hasher{border-left:5px solid var(--herd);}

  .chead{
    display:flex;align-items:center;gap:11px;
    padding:12px 14px;cursor:pointer;user-select:none;
  }
  .cid{
    font-family:ui-monospace,monospace;font-weight:700;font-size:.78rem;
    background:var(--ink);color:var(--paper);border-radius:7px;
    padding:5px 7px;min-width:42px;text-align:center;flex-shrink:0;letter-spacing:.02em;
  }
  .class.live .cid{background:var(--live);}
  .class.hasher .cid{background:var(--herd);}
  .cmid{flex:1;min-width:0;}
  .cname{font-size:.98rem;font-weight:600;line-height:1.15;}
  .cmeta{font-family:ui-monospace,monospace;font-size:.68rem;color:#7a6d56;margin-top:3px;
    display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
  .badge{background:var(--herd-soft);color:var(--herd);border-radius:5px;
    padding:1px 6px;font-weight:700;letter-spacing:.02em;}
  .donetime{color:var(--brand-deep);font-weight:700;letter-spacing:.02em;cursor:pointer;
    text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;}
  .donetime.set{color:#a2937a;font-weight:600;}
  .status{
    font-family:ui-monospace,monospace;font-size:.6rem;letter-spacing:.14em;
    text-transform:uppercase;padding:4px 8px;border-radius:20px;flex-shrink:0;
    border:1px solid var(--line);color:#7a6d56;
  }
  .status.live{background:var(--live);color:#fff;border-color:var(--live);}
  .status.done{background:var(--done);color:#fff;border-color:var(--done);}
  .chev{flex-shrink:0;color:var(--line);font-size:.8rem;transition:transform .2s;}
  .class.open .chev{transform:rotate(90deg);}

  .cbody{display:none;padding:0 14px 12px 14px;}
  .class.open .cbody{display:block;}
  .draw{
    display:flex;align-items:center;gap:10px;padding:8px 6px;
    border-top:1px solid var(--dust);
  }
  .draw:first-child{border-top:1px solid var(--line);}
  .draw .pos{font-family:ui-monospace,monospace;font-size:.72rem;color:#9a8c72;
    min-width:22px;font-weight:600;}
  .draw .dh{flex:1;font-size:.9rem;}
  .draw .dh .rn{color:#8a7c63;font-size:.8rem;}
  .draw.her{background:var(--herd-soft);border-radius:8px;margin:2px 0;
    border-top-color:transparent;padding:9px 8px;}
  .draw.her .dh{font-weight:700;color:var(--herd);}
  .draw .mkdone,.draw .mkscr{
    font-family:ui-monospace,monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
    border:1px solid var(--line);background:transparent;color:#8a7c63;border-radius:14px;
    padding:5px 9px;cursor:pointer;flex-shrink:0;font-weight:600;
  }
  .draw .mkdone.on{background:var(--herd);color:#fff;border-color:var(--herd);}
  .draw .mkdone[disabled]{opacity:.35;cursor:default;}
  .draw .mkscr.on{background:var(--live);color:#fff;border-color:var(--live);}
  /* scratched run: struck through and dimmed, no longer counts */
  .draw.scr .dh{text-decoration:line-through;color:#a2937a;}
  .draw.scr .pos{text-decoration:line-through;}
  .draw.scr{opacity:.7;}

  .tapline{
    padding:9px 6px 2px;text-align:center;font-family:ui-monospace,monospace;
    font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:#a2937a;
  }
  .cbtns{display:flex;gap:8px;padding:10px 0 2px;}
  .cbtns button{
    flex:1;font-family:ui-monospace,monospace;font-size:.66rem;letter-spacing:.06em;
    text-transform:uppercase;padding:10px;border-radius:10px;font-weight:700;cursor:pointer;
    border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
  }
  .cbtns button.live{background:var(--live);color:#fff;border-color:var(--live);}
  .cbtns button.done{background:var(--done);color:#fff;border-color:var(--done);}

  footer{padding:18px 20px 40px;color:#8a7c63;font-size:.72rem;line-height:1.5;text-align:center;}
  .reset{margin-top:10px;background:none;border:1px solid var(--line);color:#8a7c63;
    font-family:ui-monospace,monospace;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
    padding:8px 14px;border-radius:20px;cursor:pointer;}
  .ver{margin-top:12px;font-family:ui-monospace,monospace;font-size:.58rem;
    letter-spacing:.1em;color:#b3a68d;}
</style>
</head>

/* ---------- DISCIPLINES ----------
   Different events run at very different speeds (a cutting run is ~2.5 min of
   work, a boxing run only ~50 sec), so we track pace separately per discipline.
   Discipline comes from an explicit `disc` tag if present, else from the name. */
const DISC_LABEL = {cutting:"Cutting", boxing:"Boxing", cowwork:"Cow work", reining:"Reining"};
// Seed rates (min per run, wall-clock incl. turnaround). Calibration refines each.
const PACE_DEFAULT = {cutting:2.5, boxing:1.5, cowwork:2.5, reining:3};
function discOf(c){
  if(c.disc) return c.disc;                       // explicit tag wins
  const n=c.name.toLowerCase();
  if(n.includes("boxing")) return "boxing";
  if(n.includes("cow work")||n.includes("cow horse")) return "cowwork";
  if(n.includes("reining")||n.includes("rein work")) return "reining";
  return "cutting"; // herd work + ranch cutting
}

/* mark "her" rides + tag discipline for every class across all days */
DAYS.forEach(day=>day.classes.forEach(c=>{
  c.herIdx = c.draw.findIndex(d=>RIDER_RE.test(d[3].trim()));
  c.disc = discOf(c);
}));

/* ---------- STATE (saved to this device so it survives reloads) ---------- */
const SAVE_KEY = "michiTracker.v1";
// per-discipline minutes per run; refined by calibration for each discipline.
// Shared across days (a boxing run takes ~the same time whatever the day).
let paceByType = {...PACE_DEFAULT};
function paceOf(c){ return paceByType[c.disc] ?? PACE_DEFAULT[c.disc] ?? 2.5; }
let GAP_MIN = 15;         // minutes between classes (drag/settle/setup)

// Per-day state. Class IDs repeat across days (there's a C1 each day), so each
// day keeps its own marks. status: "upcoming"|"live"|"done"; runDone/runDoneAt/
// runScratch keyed `${classId}:${pos}`; classDoneAt keyed classId.
const dayState = {};
DAYS.forEach(d=>{
  // startMin = the day's first-event time as minutes past midnight (default 7:00am),
  // used as the calibration anchor so the first class's runs count too.
  const st={status:{}, runDone:{}, runDoneAt:{}, runScratch:{}, classDoneAt:{}, startMin:420};
  d.classes.forEach(c=>st.status[c.id]="upcoming");
  dayState[d.id]=st;
});

// live bindings for the currently-selected day (re-pointed by selectDay)
let currentDay = DAYS[DAYS.length-1].id;   // default to the latest day
let CLASSES, CLASS_BY_ID, status, runDone, runDoneAt, runScratch, classDoneAt, liveIdx=null;
function selectDay(id){
  if(!dayState[id]) id=DAYS[0].id;
  currentDay=id;
  CLASSES = DAYS.find(d=>d.id===id).classes;
  const st=dayState[id];
  status=st.status; runDone=st.runDone; runDoneAt=st.runDoneAt; runScratch=st.runScratch; classDoneAt=st.classDoneAt;
  CLASS_BY_ID={}; CLASSES.forEach(c=>CLASS_BY_ID[c.id]=c);
  const li=CLASSES.findIndex(c=>status[c.id]==="live"); // derive; never trust a stored index
  liveIdx = li>=0 ? li : null;
}

function saveState(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      version:2, currentDay, gapMin:GAP_MIN,
      paceByType, minPerRide:paceByType.cutting,   // legacy mirror for old versions
      days: Object.fromEntries(DAYS.map(d=>{
        const st=dayState[d.id];
        return [d.id,{status:st.status, runDone:st.runDone, runDoneAt:st.runDoneAt,
                      runScratch:st.runScratch, classDoneAt:st.classDoneAt, startMin:st.startMin}];
      }))
    }));
  }catch(e){/* storage full or blocked — app still works for the session */}
}
function loadState(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const s=JSON.parse(raw);
    if(s.paceByType && typeof s.paceByType==="object"){
      Object.keys(paceByType).forEach(k=>{ if(typeof s.paceByType[k]==="number") paceByType[k]=s.paceByType[k]; });
    } else if(typeof s.minPerRide==="number"){ paceByType.cutting=s.minPerRide; }
    if(typeof s.gapMin==="number") GAP_MIN=s.gapMin;

    const applyDay=(st,src)=>{
      if(!src) return;
      if(src.status) Object.keys(src.status).forEach(k=>{ if(k in st.status) st.status[k]=src.status[k]; });
      ["runDone","runDoneAt","runScratch","classDoneAt"].forEach(key=>{
        if(src[key]) Object.keys(src[key]).forEach(k=>{ st[key][k]=src[key][k]; });
      });
      if(typeof src.startMin==="number") st.startMin=src.startMin;
    };
    if(s.days){                       // v2 multi-day format
      DAYS.forEach(d=>applyDay(dayState[d.id], s.days[d.id]));
      if(s.currentDay && dayState[s.currentDay]) currentDay=s.currentDay;
    } else {                          // v1 flat format -> migrate old data into Day 1
      applyDay(dayState["day1"], s);
    }
  }catch(e){/* corrupt save — ignore and start fresh */}
}
loadState();
selectDay(currentDay);

/* ---------- TIMING MODEL ----------
   Anchor = the live class (if any) starting "now"; otherwise the first upcoming
   class starts "now". We walk forward summing ride time + gaps, subtracting
   runs already ticked done in the live class.
------------------------------------------------------------------- */
function estimateForHerRides(){
  // returns array of {classId, className, horse, pos, etaMin, isLiveNow}
  const results=[];
  let anchorIdx = (liveIdx!=null) ? liveIdx : CLASSES.findIndex(c=>status[c.id]!=="done");
  if(anchorIdx<0) return results;

  let cursorMin = 0; // minutes from now
  for(let i=anchorIdx;i<CLASSES.length;i++){
    const c=CLASSES[i];
    if(status[c.id]==="done") continue;
    // add class gap before non-anchor classes
    if(i!==anchorIdx) cursorMin += GAP_MIN;

    // runs within class
    for(let r=0;r<c.draw.length;r++){
      const d=c.draw[r];
      const key=`${c.id}:${d[0]}`;
      const already = runDone[key];
      const scratched = runScratch[key];
      // eta at the START of this run
      const etaThis = cursorMin;
      if(!already && !scratched){ cursorMin += paceOf(c); } // scratched runs take no time
      if(r===c.herIdx && !already && !scratched){
        // how many runs before her in this class are still to go (skip scratched)
        let ahead=0;
        for(let x=0;x<c.herIdx;x++){ const k=`${c.id}:${c.draw[x][0]}`; if(!runDone[k] && !runScratch[k]) ahead++; }
        results.push({
          classId:c.id, className:c.name, horse:`${d[1]==="—"?"":d[1]+" "}${d[2]}`,
          pos:d[0], etaMin:Math.max(0,Math.round(etaThis)), ahead,
          isLiveNow:(i===anchorIdx && status[c.id]==="live")
        });
      }
    }
  }
  return results;
}

/* Same timing walk, but one row per upcoming class (not just her rides).
   Each row: start ETA/clock, its own run time, and the gap before it. */
function estimateSchedule(){
  const rows=[];
  let anchorIdx = (liveIdx!=null) ? liveIdx : CLASSES.findIndex(c=>status[c.id]!=="done");
  if(anchorIdx<0) return rows;

  let cursorMin = 0;
  for(let i=anchorIdx;i<CLASSES.length;i++){
    const c=CLASSES[i];
    if(status[c.id]==="done") continue;
    const gapBefore = rows.length>0 ? GAP_MIN : 0; // gap before every class after the first
    cursorMin += gapBefore;
    const startMin = cursorMin;

    let remaining=0;
    c.draw.forEach(d=>{ const k=`${c.id}:${d[0]}`; if(!runDone[k] && !runScratch[k]) remaining++; });
    const dur = remaining*paceOf(c);
    cursorMin += dur;

    rows.push({
      classId:c.id, className:c.name, startMin, gapBefore, dur, remaining, disc:c.disc,
      hasHer:c.herIdx>=0, herPos: c.herIdx>=0 ? c.draw[c.herIdx][0] : null,
      isAnchor:i===anchorIdx, isLive:status[c.id]==="live"
    });
  }
  return rows;
}

/* ---------- CALIBRATION ----------
   Measure ACTUAL pace at the CLASS level, matching how the day is really run:
   you mark whole classes done (or set the next one live) — you don't tick every
   run live. For a discipline, take the finish-time stamps of its completed
   classes, anchor on the earliest, and divide the elapsed time (minus class
   gaps) by the runs completed after that anchor:

       per-run = (lastClassEnd - firstClassEnd - gaps) / runs-after-the-first

   Robust to *when* you tapped: it uses one stamp per class (recorded once,
   naturally spread across the day), never per-run tap times — so late or bulk
   marking of individual runs can't corrupt it. Measured per discipline so e.g.
   boxing isn't diluted by reining. The first completed class is the anchor and
   every completed class contributes when we have a start anchor. Returns
   {perRun, runs, classes} or null. */
function dayStartMin(){ const st=dayState[currentDay]; return (st && typeof st.startMin==="number") ? st.startMin : 420; }
function dayStartTs(refTs){ // the day's start time (e.g. 7am) on the date of refTs
  const d=new Date(refTs!=null?refTs:Date.now()); d.setHours(0,0,0,0);
  return d.getTime() + dayStartMin()*60000;
}
function measurePace(disc){
  // completed, finish-stamped classes of this discipline, in running order
  const done = CLASSES.map((c,idx)=>({c,idx}))
    .filter(o=>o.c.disc===disc && status[o.c.id]==="done" && classDoneAt[o.c.id]!=null)
    .sort((a,b)=>a.idx-b.idx);
  if(done.length < 1) return null;

  const first=done[0], lastEnd=classDoneAt[done[done.length-1].c.id];
  const runsIn=o=>{ let n=0; o.c.draw.forEach(d=>{ if(!runScratch[`${o.c.id}:${d[0]}`]) n++; }); return n; };

  // Anchor the FIRST class on a known start: the day start (7am) if it's the very
  // first class of the day, else the finish time of the class right before it.
  let anchor=null, gapBeforeFirst=0;
  if(first.idx===0){ anchor=dayStartTs(classDoneAt[first.c.id]); gapBeforeFirst=0; }
  else {
    const prev=CLASSES[first.idx-1];
    if(status[prev.id]==="done" && classDoneAt[prev.id]!=null){ anchor=classDoneAt[prev.id]; gapBeforeFirst=1; }
  }

  let perRun=null, usedRuns=0;
  if(anchor!=null && lastEnd>anchor){                 // preferred: every done class counts
    const spanMin=(lastEnd-anchor)/60000;
    usedRuns=done.reduce((s,o)=>s+runsIn(o),0);
    const rideMin=spanMin-(done.length-1+gapBeforeFirst)*GAP_MIN;
    if(usedRuns>=3 && rideMin>0) perRun=rideMin/usedRuns;
  }
  if(perRun==null && done.length>=2){                 // fallback: no anchor -> skip first class
    const spanMin=(lastEnd-classDoneAt[first.c.id])/60000;
    usedRuns=done.slice(1).reduce((s,o)=>s+runsIn(o),0);
    const rideMin=spanMin-(done.length-1)*GAP_MIN;
    if(usedRuns>=3 && rideMin>0) perRun=rideMin/usedRuns;
  }
  if(perRun==null || perRun<0.3 || perRun>20) return null;
  return { perRun, runs:usedRuns, classes:done.length };
}

/* the discipline currently in play — live class, else next upcoming */
function currentDisc(){
  let idx = (liveIdx!=null) ? liveIdx : CLASSES.findIndex(c=>status[c.id]!=="done");
  return idx>=0 ? CLASSES[idx].disc : "cutting";
}

/* ---------- RENDER ---------- */
const $ = s=>document.querySelector(s);

function fmtETA(min){
  if(min<=0) return "now";
  if(min<60) return min+"m";
  const h=Math.floor(min/60), m=min%60;
  return h+"h"+(m?" "+m+"m":"");
}
function clockAt(min){
  const t=new Date(Date.now()+min*60000);
  let h=t.getHours(), m=t.getMinutes();
  const ap=h>=12?"pm":"am"; h=h%12||12;
  return h+":"+String(m).padStart(2,"0")+ap;
}
function fmtClockTs(ts){   // format an absolute epoch-ms timestamp as clock time
  const t=new Date(ts);
  let h=t.getHours(), m=t.getMinutes();
  const ap=h>=12?"pm":"am"; h=h%12||12;
  return h+":"+String(m).padStart(2,"0")+ap;
}
function fmtMinOfDay(min){ // format minutes-past-midnight as clock time
  let h=Math.floor(min/60), m=min%60;
  const ap=h>=12?"pm":"am"; h=h%12||12;
  return h+":"+String(m).padStart(2,"0")+ap;
}
// parse a typed time like "2:45pm" or "14:45" into today's epoch ms; null if bad
function parseTimeInput(str){
  const m=str.toLowerCase().replace(/\s+/g,"").match(/^(\d{1,2}):(\d{2})(am|pm)?$/);
  if(!m) return null;
  let h=+m[1]; const min=+m[2], ap=m[3];
  if(min>59 || h>23) return null;
  if(ap==="pm" && h<12) h+=12;
  if(ap==="am" && h===12) h=0;
  if(h>23) return null;
  const d=new Date(); d.setHours(h,min,0,0);
  return d.getTime();
}
// record when a class was marked done, keeping the first stamp if already set
function stampDone(id){ if(!classDoneAt[id]) classDoneAt[id]=Date.now(); }

function renderNext(){
  const her=estimateForHerRides();
  const card=$("#nextcard");
  if(her.length===0){
    card.innerHTML=`<div class="next none">
      <div class="tag">All done</div>
      <div class="cls">No more rides for Michi today 🎉</div>
      <div class="queue">Mark classes back to upcoming if you're testing.</div>
    </div>`;
    return;
  }
  const n=her[0];
  const rest=her.slice(1);
  let bigTxt, subTxt;
  if(n.isLiveNow && n.ahead===0){
    // everyone before her in the live class is done — she's up
    bigTxt="UP NOW";
    subTxt="She's next in the draw — into the arena";
  } else if(n.isLiveNow){
    // in the live class with riders still ahead — show the countdown to her
    bigTxt="~"+fmtETA(n.etaMin);
    subTxt=`${n.ahead} rider${n.ahead>1?"s":""} before her · ~${clockAt(n.etaMin)}`;
  } else {
    bigTxt="~"+fmtETA(n.etaMin);
    subTxt="est. ride ~"+clockAt(n.etaMin)+"<br>if things run to pace";
  }
  card.innerHTML=`<div class="next">
    <div class="tag">${n.isLiveNow?"Riding area · in this class now":"Next ride · "+n.classId}</div>
    <div class="cls">${n.classId} — ${n.className}</div>
    <div class="horse"><b>#${n.pos} in the draw</b> · ${n.horse}</div>
    <div class="eta">
      <div class="big util">${bigTxt}</div>
      <div class="sub">${subTxt}</div>
    </div>
    ${rest.length?`<div class="queue">Then: ${rest.map(r=>`${r.classId} (~${fmtETA(r.etaMin)})`).join(" · ")}</div>`:""}
  </div>`;
}

let scheduleOpen=false; // "rest of day" list collapsed by default
function renderSchedule(){
  const el=$("#schedule");
  const rows=estimateSchedule();
  // Only worth showing when there's at least one class after the current one.
  if(rows.length<=1){ el.innerHTML=""; return; }

  const last=rows[rows.length-1];
  const endMin=last.startMin+last.dur;
  const herLeft=rows.filter(r=>r.hasHer).length;

  const body=rows.map((r,idx)=>{
    const gap = idx>0 ? `<div class="sgap">↕ +${GAP_MIN} min between classes</div>` : "";
    const etaTxt = r.startMin<=0 ? (r.isLive?"live now":"now") : "~"+fmtETA(r.startMin);
    const runTxt = `${DISC_LABEL[r.disc]} · ${r.remaining} run${r.remaining!==1?"s":""} · ~${Math.round(r.dur)} min`;
    return gap + `<div class="srow${r.hasHer?" her":""}${r.isLive?" live":""}">
      <div class="scid">${r.classId}</div>
      <div class="smid">
        <div class="sname">${r.className}${r.hasHer?`<span class="sbadge">MICHI · #${r.herPos}</span>`:""}</div>
        <div class="smeta">${runTxt}</div>
      </div>
      <div class="stime">
        <div class="clk">${clockAt(r.startMin)}</div>
        <div class="eta">${etaTxt}</div>
      </div>
    </div>`;
  }).join("");

  el.innerHTML=`<div class="sched${scheduleOpen?" open":""}">
    <div class="sched-head" data-sched="1">
      <span class="lbl">Rest of day</span>
      <span class="sum">${rows.length} classes${herLeft?` · ${herLeft} for Michi`:""} · ends ~${clockAt(endMin)}</span>
      <span class="chev">▶</span>
    </div>
    <div class="sched-body">${body}</div>
  </div>`;
}

function renderCalib(){
  const el=$("#calib");
  const disc=currentDisc();                    // calibrate the discipline in play
  const cur=paceByType[disc];
  const label=DISC_LABEL[disc];
  const m=measurePace(disc);
  if(!m){ el.innerHTML=""; return; }            // not enough marks of this discipline yet
  const obs=Math.round(m.perRun*10)/10;        // one decimal
  const diff=Math.abs(obs-cur);
  if(diff<0.3){
    // reality agrees with the estimate — reassure, no action needed
    el.innerHTML=`<div class="calib match">
      <div class="msg">On pace: ${label.toLowerCase()} is running <b>~${obs} min/run</b> over ${m.runs} runs — your ~${cur} min estimate looks right.</div>
    </div>`;
    return;
  }
  const dir = obs>cur ? "slower" : "faster";
  el.innerHTML=`<div class="calib">
    <div class="msg"><b>${label}</b> running <b>${dir}</b> than estimated: actual pace is <b>~${obs} min/run</b> over ${m.runs} runs (set to ${cur}).</div>
    <button data-calib="${obs}" data-disc="${disc}">Use ${obs}</button>
  </div>`;
}

function renderPace(){
  const disc=currentDisc();
  const cur=paceByType[disc];
  $("#pacenote").innerHTML =
    `Assuming <b>~${cur} min</b> per ${DISC_LABEL[disc].toLowerCase()} run and <b>~${GAP_MIN} min</b> between classes `+
    `(herd settle · arena drag · setup). Each discipline keeps its own pace. Tap a class <b>Live</b> when it starts to re-anchor the clock.`;
  $("#minDisc").textContent=DISC_LABEL[disc];
  $("#minLabel").textContent=cur;
  $("#gapLabel").textContent=GAP_MIN;
}

function renderList(){
  const list=$("#list"); list.innerHTML="";
  CLASSES.forEach((c,i)=>{
    const st=status[c.id];
    const isLive=st==="live", isDone=st==="done";
    const hasHer=c.herIdx>=0;
    const el=document.createElement("div");
    el.className="class"+(isLive?" live":"")+(isDone?" done":"")+(hasHer?" hasher":"");
    if(c._open) el.classList.add("open");

    const runs=c.draw.length;
    const herHorse = hasHer? c.draw[c.herIdx][2] : null;

    el.innerHTML=`
      <div class="chead" data-toggle="${i}">
        <div class="cid">${c.id}</div>
        <div class="cmid">
          <div class="cname">${c.name}</div>
          <div class="cmeta">
            <span>${runs} run${runs>1?"s":""}${c.partial?" (from #"+c.draw[0][0]+")":""}</span>
            ${hasHer?`<span class="badge">MICHI · #${c.draw[c.herIdx][0]}</span>`:""}
            ${hasHer?`<span>${herHorse}</span>`:""}
            ${isDone?(classDoneAt[c.id]
              ? `<span class="donetime" data-finish="${c.id}">done ${fmtClockTs(classDoneAt[c.id])} ✎</span>`
              : `<span class="donetime set" data-finish="${c.id}">+ finish time</span>`):""}
          </div>
        </div>
        ${isLive?'<span class="status live">Live</span>':isDone?'<span class="status done">Done</span>':'<span class="status">Upcoming</span>'}
        <span class="chev">▶</span>
      </div>
      <div class="cbody">
        ${c.draw.map(d=>{
          const her=RIDER_RE.test(d[3].trim());
          const key=`${c.id}:${d[0]}`;
          const done=!!runDone[key];
          const scr=!!runScratch[key];
          return `<div class="draw ${her?"her":""}${scr?" scr":""}">
            <span class="pos">${d[0]}</span>
            <span class="dh">${d[1]==="—"?"":d[1]+" "}${d[2]} <span class="rn">· ${d[3]}</span></span>
            <button class="mkscr ${scr?"on":""}" data-scr="${key}">${scr?"scratched":"scratch"}</button>
            <button class="mkdone ${done?"on":""}" data-run="${key}"${scr?" disabled":""}>${done?"✓ ran":"ran"}</button>
          </div>`;
        }).join("")}
        <div class="cbtns">
          <button class="live" data-live="${i}">${isLive?"● Live now":"Set Live"}</button>
          <button class="done" data-done="${i}">${isDone?"✓ Done":"Mark Done"}</button>
          <button data-up="${i}">Upcoming</button>
        </div>
      </div>`;
    list.appendChild(el);
  });
}

function renderDays(){
  $("#days").innerHTML = DAYS.map(d=>
    `<button class="${d.id===currentDay?"on":""}" data-day="${d.id}">${d.label}</button>`
  ).join("");
}
function renderDayStart(){
  $("#daystart").innerHTML = `Day starts <b data-start="1">${fmtMinOfDay(dayStartMin())}</b> — anchors the pace estimate`;
}
function renderAll(){ saveState(); renderDays(); renderNext(); renderSchedule(); renderCalib(); renderDayStart(); renderPace(); renderList(); }

/* ---------- EVENTS ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-day],[data-start],[data-finish],[data-toggle],[data-live],[data-done],[data-up],[data-run],[data-scr],[data-sched],[data-calib]");
  if(!t) return;

  if(t.hasAttribute("data-day")){
    const id=t.getAttribute("data-day");
    if(id!==currentDay){ selectDay(id); renderAll(); }
    return;
  }
  if(t.hasAttribute("data-start")){
    const ans=prompt("Day start time (when the first event began, e.g. 7:00am or 07:00):", fmtMinOfDay(dayStartMin()));
    if(ans!==null){
      const s=ans.trim();
      const ts=parseTimeInput(s);
      if(ts!=null){ const d=new Date(ts); dayState[currentDay].startMin=d.getHours()*60+d.getMinutes(); renderAll(); }
      else if(s!=="") alert("Couldn't read that — try like 7:00am or 07:00.");
    }
    return;
  }
  if(t.hasAttribute("data-finish")){
    const id=t.getAttribute("data-finish");
    const cur=classDoneAt[id]?fmtClockTs(classDoneAt[id]):"";
    const ans=prompt(`Finish time for ${id} (e.g. 2:45pm or 14:45).\nLeave blank to clear.`, cur);
    if(ans!==null){
      const s=ans.trim();
      if(s===""){ delete classDoneAt[id]; renderAll(); }
      else { const ts=parseTimeInput(s);
        if(ts!=null){ classDoneAt[id]=ts; renderAll(); }
        else alert("Couldn't read that — try like 2:45pm or 14:45."); }
    }
    return;
  }
  if(t.hasAttribute("data-calib")){
    const v=parseFloat(t.getAttribute("data-calib"));
    const d=t.getAttribute("data-disc")||currentDisc();
    if(!isNaN(v)) paceByType[d]=v;   // adopt measured pace for THIS discipline
    renderAll(); return;
  }
  if(t.hasAttribute("data-sched")){
    scheduleOpen=!scheduleOpen;
    renderSchedule(); return;
  }
  if(t.hasAttribute("data-toggle")){
    const i=+t.getAttribute("data-toggle");
    CLASSES[i]._open=!CLASSES[i]._open;
    renderList(); return;
  }
  if(t.hasAttribute("data-run")){
    const key=t.getAttribute("data-run");
    if(runScratch[key]) return;      // scratched horses can't be marked as ran
    runDone[key]=!runDone[key];
    // stamp when it was marked so we can measure actual pace; clear on un-mark
    if(runDone[key]) runDoneAt[key]=Date.now(); else delete runDoneAt[key];
    renderAll(); return;
  }
  if(t.hasAttribute("data-scr")){
    const key=t.getAttribute("data-scr");
    runScratch[key]=!runScratch[key];
    if(runScratch[key]){             // scratched: can't also be "ran"
      delete runDone[key]; delete runDoneAt[key];
    }
    renderAll(); return;
  }
  if(t.hasAttribute("data-live")){
    const i=+t.getAttribute("data-live");
    if(status[CLASSES[i].id]==="live"){ status[CLASSES[i].id]="upcoming"; liveIdx=null; }
    else {
      // the last not-yet-done class before this one is the one that just finished —
      // stamp only that one (don't touch classes that were already done, and don't
      // bulk-stamp everything with "now", which would be wrong)
      let justFinished=-1;
      for(let j=i-1;j>=0;j--){ if(status[CLASSES[j].id]!=="done"){ justFinished=j; break; } }
      CLASSES.forEach((c,j)=>{ if(j<i) status[c.id]="done"; }); // earlier classes are done
      if(justFinished>=0) stampDone(CLASSES[justFinished].id);
      status[CLASSES[i].id]="live"; liveIdx=i;
      delete classDoneAt[CLASSES[i].id];   // now live, no longer "done"
    }
    CLASSES[i]._open=true;
    renderAll(); return;
  }
  if(t.hasAttribute("data-done")){
    const i=+t.getAttribute("data-done");
    status[CLASSES[i].id]="done"; stampDone(CLASSES[i].id);
    if(liveIdx===i) liveIdx=null;
    renderAll(); return;
  }
  if(t.hasAttribute("data-up")){
    const i=+t.getAttribute("data-up");
    status[CLASSES[i].id]="upcoming";
    delete classDoneAt[CLASSES[i].id];     // back to upcoming, drop the done time
    if(liveIdx===i) liveIdx=null;
    renderAll(); return;
  }
});

$("#setMin").addEventListener("click",()=>{
  const opts=[1.5,2,2.5,3,3.5,4];
  const d=currentDisc();          // adjust the discipline currently in play
  // if the value came from calibration it may sit off the preset steps —
  // jump to the next preset above the current value, wrapping around
  let i=opts.indexOf(paceByType[d]);
  if(i<0) i=opts.findIndex(o=>o>paceByType[d])-1; // so +1 below lands on that next step
  paceByType[d]=opts[(i+1+opts.length)%opts.length];
  renderAll();
});
$("#setGap").addEventListener("click",()=>{
  const opts=[5,10,15,20,30];
  GAP_MIN=opts[(opts.indexOf(GAP_MIN)+1)%opts.length];
  renderAll();
});
$("#reset").addEventListener("click",()=>{
  const label=DAYS.find(d=>d.id===currentDay).label;
  if(!confirm(`Reset ${label}? This clears every Live/Done mark for this day only.`)) return;
  // clear the current day's marks only — the other day is untouched
  CLASSES.forEach(c=>{status[c.id]="upcoming"; c._open=false;});
  [runDone, runDoneAt, runScratch, classDoneAt].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));
  liveIdx=null;
  renderAll();
});
$("#clearTimes").addEventListener("click",()=>{
  if(!confirm("Clear all class finish times? Live/Done marks and runs are kept.")) return;
  Object.keys(classDoneAt).forEach(k=>delete classDoneAt[k]);
  renderAll();
});

/* live clock in header */
function tick(){
  const t=new Date();
  let h=t.getHours(),m=t.getMinutes();
  const ap=h>=12?"pm":"am"; h=h%12||12;
  $("#hclock").textContent="· "+h+":"+String(m).padStart(2,"0")+ap;
  renderNext(); renderSchedule(); // keep ETAs/clock times fresh
}
setInterval(tick,30000);

$("#ver").textContent = APP_VERSION;
renderAll(); tick();
</script>
</body>
